    <!-- Tema aplicado antes del primer pintado: sin parpadeo al recargar -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('vira-theme')
          if (stored === 'dark' || stored === 'light') {
            document.documentElement.setAttribute('data-theme', stored)
          }
          var lang = localStorage.getItem('vira-lang')
          if (lang === 'es' || lang === 'en') {
            document.documentElement.setAttribute('lang', lang)
          }

          // El logo del hero es el LCP del Home: se precarga la variante
          // que corresponde al tema ya resuelto, no las dos.
          var dark = stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (location.pathname === '/') {
            // Vite reemplaza %VITE_MEDIA_BASE_URL% al compilar. Si la variable
            // no existe, deja el texto tal cual: por eso se descarta si empieza con %.
            var media = '%VITE_MEDIA_BASE_URL%'
            if (media.charAt(0) === '%') media = ''
            media = media.replace(/\/$/, '')

            var preload = document.createElement('link')
            preload.rel = 'preload'
            preload.as = 'image'
            preload.href = media + '/img/brand/' + (dark ? 'vira-blanco' : 'vira-color') + '-800.png'
            preload.setAttribute('fetchpriority', 'high')
            document.head.appendChild(preload)
          }
        } catch (error) {
          /* almacenamiento no disponible: queda la preferencia del sistema */
        }
      })()
    </script>
